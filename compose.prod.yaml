services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roadbook
      POSTGRES_USER: roadbook
      POSTGRES_PASSWORD: roadbook
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadbook -d roadbook"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/roadbook
      SPRING_DATASOURCE_USERNAME: roadbook
      SPRING_DATASOURCE_PASSWORD: roadbook
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8080:8080"

volumes:
  pgdata-prod: